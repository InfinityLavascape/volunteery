<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizations | Volunteer Hub</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
</head>
<body class="merriweather-prominent">
    <header class="site-header">
        <div class="brand">Volunteer Hub</div>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html#home">Home</a>
            <a href="Organizations.html">Organizations</a>
        </nav>
    </header>

    <main class="page-shell content">
        <section class="article">
            <h1>Organizations</h1>

            <div class="search-box-wrap">
                <input type="text" id="organizationSearch" placeholder="Search organizations..." aria-label="Search organizations">
            </div>

            <table class="org-table" aria-label="Volunteer organizations table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Site</th>
                    </tr>
                </thead>
                <tbody id="orgTableBody"></tbody>
            </table>
        </section>
    </main>

    <footer class="site-footer">
        <p>Volunteer Hub © 2026</p>
    </footer>

    <script src="organizations-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
